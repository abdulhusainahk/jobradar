name: JobRadar monitor

on:
  schedule:
    # Twice hourly, away from the busy hour boundary. GitHub may delay/skip runs;
    # this is best-effort scheduling, not a 30-minute delivery guarantee.
    - cron: "17,47 * * * *"
  workflow_dispatch:      # lets you run it manually from the Actions tab
    inputs:
      test_alert:
        description: "Send ONE test alert to confirm Telegram/email works, then exit"
        type: boolean
        default: false
      resend_all:
        description: "Re-send ALL current matches as one fit-ranked digest (non-destructive)"
        type: boolean
        default: false

# Needed so the job can commit the updated seen_jobs.json back to the repo.
permissions:
  contents: write

concurrency:
  group: jobradar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run JobRadar
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:         ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          # Missing/failed Gemini credentials retain keyword-only matching.
          AI_SCORING:         ${{ vars.AI_SCORING || 'on' }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          AI_MIN_SCORE:       ${{ vars.AI_MIN_SCORE || '0' }}
          AI_MAX_ATTEMPTS:    ${{ vars.AI_MAX_ATTEMPTS || '3' }}
          AI_REQUESTS_PER_MINUTE: ${{ vars.AI_REQUESTS_PER_MINUTE || '10' }}
          JOBRADAR_MODEL:     ${{ vars.JOBRADAR_MODEL }}
          JOBRADAR_TEST_ALERT: ${{ inputs.test_alert }}
          JOBRADAR_RESEND_ALL: ${{ inputs.resend_all }}
        run: python -m jobradar

      - name: Persist seen-jobs state
        # Preserve retryable alerts even when a source/channel failed.
        if: ${{ always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        run: |
          git config user.name  "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
